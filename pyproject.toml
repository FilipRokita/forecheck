[project]
name = "forecheck"
version = "0.1.0"
description = "How far can you trust a weather forecast? Open-Meteo models scored against IMGW stations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
]

[dependency-groups]
# Applies migrations on the host build (see scripts/migrate.sh). Kept apart so
# the build installs only what Alembic needs.
migrate = [
    "alembic",
    "psycopg[binary]",
    "sqlalchemy",
]
# Local batch scripts only (exploration, backfill). Never imported by the API.
batch = [
    "pandas",
    "pandas-stubs",
]
dev = [
    "hypothesis",
    "import-linter",
    "mypy",
    "pytest",
    "respx",
    "ruff",
    "uvicorn[standard]",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "api", "tests", "scripts", "migrations"]
extend-exclude = ["node_modules", ".next", ".venv", ".migrate-venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "TID", "T20", "PERF", "PL"]
ignore = ["PLR2004", "PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "T20"]
"scripts/**" = ["T20", "PLR0915", "PLR0912", "E501", "SLF001"]
"migrations/**" = ["N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["backend"]
files = ["backend", "api", "tests", "migrations"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs PostgreSQL (TEST_DATABASE_URL)"]

[tool.importlinter]
root_package = "forecheck"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inwards"
type = "layers"
layers = [
    "forecheck.entrypoints",
    "forecheck.infrastructure",
    "forecheck.application",
    "forecheck.domain",
]

[[tool.importlinter.contracts]]
name = "The domain and the use cases know no framework or I/O library"
type = "forbidden"
source_modules = ["forecheck.domain", "forecheck.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "httpx",
    "pandas",
    "numpy",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The domain does not reach the use cases"
type = "forbidden"
source_modules = ["forecheck.domain"]
forbidden_modules = ["forecheck.application", "forecheck.infrastructure", "forecheck.entrypoints"]
